name: Deploy GCP

on:
  push:
    branches: [inmob-2026, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-109d2907-7ec6-4594-814
  PROJECT_NUMBER: "791389290470"
  VM_NAME: vallecaro

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/791389290470/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@project-109d2907-7ec6-4594-814.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Rebuild app on the VM
        env:
          INMOB_ENV_PROD: ${{ secrets.INMOB_ENV_PROD }}
        run: |
          set -euo pipefail
          ZONE="$(gcloud compute instances list \
            --project="${PROJECT_ID}" \
            --filter="name=${VM_NAME}" \
            --format='value(zone.basename())')"
          printf '%s\n' "${INMOB_ENV_PROD}" > /tmp/inmob.env.prod
          gcloud compute scp /tmp/inmob.env.prod \
            "${VM_NAME}:/tmp/inmob.env.prod" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --tunnel-through-iap \
            --quiet
          gcloud compute scp scripts/vm-deploy.sh \
            "${VM_NAME}:/tmp/vm-deploy.sh" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --tunnel-through-iap \
            --quiet
          gcloud compute ssh "${VM_NAME}" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --command="bash /tmp/vm-deploy.sh"
